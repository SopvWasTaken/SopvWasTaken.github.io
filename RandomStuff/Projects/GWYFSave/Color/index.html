<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Gamble With Your Friends Skin Color Changer</title>
    <meta name="description" content="Edit player skin color in Simple Gamble With Your Friends. Change color and unlock all cosmetics.">
    <meta property="og:title" content="Simple Gamble With Your Friends Skin Color Changer">
    <meta property="og:description" content="Edit player skin color and unlock cosmetics in GWYF">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Simple Gamble With Your Friends Skin Color Changer">
    <style>
        :root {
            color-scheme: dark;
            background: #0c1220;
            color: #f2f5ff;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        * {
            box-sizing: border-box;
        }
        html, body {
            min-height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            background: radial-gradient(circle at top, rgba(100, 150, 255, 0.16), transparent 30%),
                        radial-gradient(circle at bottom right, rgba(140, 70, 255, 0.12), transparent 28%),
                        #07101b;
        }
        .frame {
            width: min(1100px, 100%);
            max-height: calc(100vh - 2rem);
            padding: 1.5rem;
            border-radius: 28px;
            background: rgba(15, 23, 42, 0.94);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.25);
            overflow-y: auto;
        }
        header {
            display: grid;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }
        header h1 {
            margin: 0;
            font-size: clamp(2rem, 2.8vw, 3.3rem);
            letter-spacing: -0.04em;
        }
        header p {
            margin: 0;
            color: #b8c2ff;
            max-width: 60ch;
            line-height: 1.7;
        }
        .card {
            margin-bottom: 1.5rem;
            padding: 1.6rem;
            border-radius: 22px;
            background: rgba(15, 23, 42, 0.76);
            border: 1px solid rgba(255,255,255,0.06);
        }
        .card h2 {
            margin-top: 0;
            margin-bottom: 1rem;
            font-size: 1.25rem;
        }
        .field-group {
            display: grid;
            gap: 1rem;
        }
        .field {
            display: grid;
            gap: 0.35rem;
        }
        .field label {
            font-size: 0.95rem;
            color: #c8d0ff;
        }
        .field input[type="text"],
        .field input[type="number"],
        .field input[type="file"],
        .field input[type="color"] {
            width: 100%;
            padding: 0.95rem 1rem;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(14, 22, 40, 0.9);
            color: #eef3ff;
            font-size: 1rem;
        }
        .field input[type="file"] {
            cursor: pointer;
            padding: 0.65rem 0.85rem;
        }
        .field input[type="color"] {
            padding: 0.6rem;
            height: 3rem;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            margin-top: 1rem;
        }
        button {
            border: none;
            cursor: pointer;
            border-radius: 14px;
            padding: 0.95rem 1.5rem;
            font-weight: 700;
            font-size: 1rem;
            background: linear-gradient(135deg, #6c8cff 0%, #4f7bff 100%);
            color: white;
            box-shadow: 0 18px 40px rgba(79, 123, 255, 0.22);
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 22px 44px rgba(79, 123, 255, 0.3);
        }
        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            box-shadow: none;
        }
        .notice {
            margin-top: 0.75rem;
            padding: 1rem 1.1rem;
            border-radius: 16px;
            background: rgba(70, 78, 112, 0.16);
            border: 1px solid rgba(111, 123, 255, 0.16);
            color: #d7ddff;
        }
        .status {
            margin-top: 1rem;
            color: #a2b0ff;
            font-size: 0.95rem;
        }
        .field-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        @media (max-width: 600px) {
            .field-grid-2 {
                grid-template-columns: 1fr;
            }
        }
        .nav-footer {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1rem;
            z-: 100;
        }
        .nav-footer a {
            text-decoration: none;
        }
        .coin-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-: 1000;
            justify-content: center;
            align-items: center;
        }
        .coin-modal.active {
            display: flex;
        }
        .coin-container {
            position: relative;
            width: 150px;
            height: 150px;
            perspective: 1000px;
        }
        .coin {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
        }
        @keyframes flip {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(1980deg); }
        }
        .coin-side {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            font-weight: bold;
            border-radius: 50%;
            backface-visibility: hidden;
        }
        .coin-green {
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(34, 197, 94, 0.4);
        }
        .coin-red {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(220, 38, 38, 0.4);
            transform: rotateY(180deg);
        }
        .coin-result {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            margin-top: 150px;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .coin-result.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="frame">
        <header>
            <h1>Simple Gamble With Your Friends Skin Color Changer</h1>
            <p>Upload your cosmetics JSON file from:</p>
            <p>%appdata%\..\LocalLow\TENSTACK\Gamble With Your Friends</p>
        </header>

        <section class="card">
            <h2>Step 1: Upload your cosmetics file</h2>
            <div class="field-group">
                <div class="field">
                    <label for="colorFile">Choose JSON cosmetics file</label>
                    <input id="colorFile" type="file" accept=".json" />
                </div>
                <div class="actions">
                    <button id="loadButton" type="button" disabled>Load File</button>
                    <button id="downloadButton" type="button" disabled>Download Edited File</button>
                </div>
                <p class="status" id="fileStatus">No file loaded yet.</p>
            </div>
        </section>

        <section class="card" id="editorSection" style="display: none;">
            <h2>Color Editor</h2>
            <div class="notice">Edit your player skin color using the color picker.</div>
            <div class="field-grid-2">
                <div class="field">
                    <label for="colorPicker">Pick a color</label>
                    <input id="colorPicker" type="color" />
                </div>
                <div class="field">
                    <label for="hexInput">Hex Code (without #)</label>
                    <input id="hexInput" type="text" maxlength="6" placeholder="FFFFFF" />
                </div>
            </div>
        </section>

        <section class="card" id="cosmeticsSection" style="display: none;">
            <h2>Cosmetics</h2>
            <button id="unlockButton" type="button">Unlock All Cosmetics</button>
            <div class="status" id="cosmeticsStatus"></div>
        </section>
    </div>

    <div class="coin-modal" id="coinModal">
        <div class="coin-container">
            <div class="coin" id="coinFlip">
                <div class="coin-side coin-green">✓</div>
                <div class="coin-side coin-red">✗</div>
            </div>
            <div class="coin-result" id="coinResult"></div>
        </div>
    </div>

    <nav class="nav-footer">
        <a href="../" style="text-decoration: none;"><button type="button">Go to Save File Editor</button></a>
    </nav>

    <script>
        const fileInput = document.getElementById('colorFile');
        const loadButton = document.getElementById('loadButton');
        const downloadButton = document.getElementById('downloadButton');
        const editorSection = document.getElementById('editorSection');
        const cosmeticsSection = document.getElementById('cosmeticsSection');
        const fileStatus = document.getElementById('fileStatus');
        const saveInfo = document.getElementById('saveInfo');
        const cosmeticsStatus = document.getElementById('cosmeticsStatus');
        const colorPicker = document.getElementById('colorPicker');
        const hexInput = document.getElementById('hexInput');
        const unlockButton = document.getElementById('unlockButton');

        let loadedFileName = '';
        let colorData = null;
        let allCosmeticsUnlocked = false;

        // All cosmetics from 1 to 220
        const allCosmeticIds = Array.from({length: 220}, (_, i) => i + 1);

        function renderEditor() {
            if (!colorData) return;
            editorSection.style.display = 'block';
            cosmeticsSection.style.display = 'block';

            // Extract hex color (first 6 characters, ignore FF at end)
            const fullColor = colorData.playerColorHex || '000000FF';
            const hexColor = fullColor.substring(0, 6);

            colorPicker.value = '#' + hexColor;
            hexInput.value = hexColor.toUpperCase();
            cosmeticsStatus.textContent = allCosmeticsUnlocked ? '✓ All cosmetics unlocked' : 'Click "Unlock All Cosmetics" to unlock them';
        }

        function updateColorPreview(hex) {
            colorPreview.style.backgroundColor = '#' + hex;
        }

        function syncColorInputs(fromPicker = false) {
            if (fromPicker) {
                const hex = colorPicker.value.substring(1).toUpperCase();
                hexInput.value = hex;
            } else {
                const hex = hexInput.value.toUpperCase();
                if (hex.length === 6 && /^[0-9A-F]{6}$/.test(hex)) {
                    colorPicker.value = '#' + hex;
                }
            }
            if (colorData) {
                colorData.playerColorHex = hexInput.value.toUpperCase() + 'FF';
            }
        }

        function unlockAllCosmetics() {
            if (!colorData) return;
            colorData.unlockedCosmetics = allCosmeticIds;
            allCosmeticsUnlocked = true;
            cosmeticsStatus.textContent = '✓ All cosmetics unlocked';
            unlockButton.disabled = true;
        }

        loadButton.addEventListener('click', () => {
            const file = fileInput.files?.[0];
            if (!file) {
                fileStatus.textContent = 'Please choose a JSON file first.';
                return;
            }
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    colorData = JSON.parse(reader.result);
                    loadedFileName = file.name;
                    fileStatus.textContent = `Loaded ${file.name}. You can now edit the color and manage cosmetics.`;
                    downloadButton.disabled = false;
                    allCosmeticsUnlocked = false;
                    unlockButton.disabled = false;
                    renderEditor();
                } catch (error) {
                    colorData = null;
                    fileStatus.textContent = 'Invalid JSON file. Please choose a valid cosmetics JSON file.';
                    editorSection.style.display = 'none';
                    cosmeticsSection.style.display = 'none';
                    downloadButton.disabled = true;
                }
            };
            reader.onerror = () => {
                fileStatus.textContent = 'Unable to read the file. Please try again.';
            };
            reader.readAsText(file);
        });

        fileInput.addEventListener('change', () => {
            loadButton.disabled = !fileInput.files?.length;
            if (fileInput.files?.length) {
                fileStatus.textContent = `Selected ${fileInput.files[0].name}. Press Load File to open it.`;
            }
        });

        colorPicker.addEventListener('input', () => syncColorInputs(true));
        hexInput.addEventListener('input', () => syncColorInputs(false));

        unlockButton.addEventListener('click', unlockAllCosmetics);

        downloadButton.addEventListener('click', () => {
            if (!colorData) return;
            downloadButton.disabled = true;
            showCoinFlip(() => {
                const jsonText = JSON.stringify(colorData, null, 4);
                const blob = new Blob([jsonText], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = loadedFileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                downloadButton.disabled = false;
            });
        });

        function showCoinFlip(onSuccess) {
            const coinModal = document.getElementById('coinModal');
            const coinFlip = document.getElementById('coinFlip');
            const coinResult = document.getElementById('coinResult');
            const isWin = Math.random() > 0.5;

            coinModal.classList.add('active');
            coinFlip.style.transform = 'rotateY(0deg)';
            coinFlip.style.transition = 'none';
            coinResult.classList.remove('show');
            coinResult.textContent = '';

            setTimeout(() => {
                coinFlip.style.transition = 'transform 2.5s ease-in-out';
                coinFlip.style.transform = isWin ? 'rotateY(1800deg)' : 'rotateY(1980deg)';
            }, 10);

            setTimeout(() => {
                if (isWin) {
                    coinResult.textContent = '✓ You got GREEN! Download starting...';
                    coinResult.style.color = '#4ade80';
                    coinResult.classList.add('show');
                    setTimeout(() => {
                        coinModal.classList.remove('active');
                        onSuccess();
                    }, 1500);
                } else {
                    coinResult.textContent = '✗ You got RED! Try again';
                    coinResult.style.color = '#ef4444';
                    coinResult.classList.add('show');
                    setTimeout(() => {
                        coinModal.classList.remove('active');
                        downloadButton.disabled = false;
                    }, 1500);
                }
            }, 2700);
        }
    </script>
<div id="kawCorner" style="position:fixed;bottom:16px;right:16px;z-index:9999;cursor:pointer;user-select:none;">
    <img id="kawCornerImg" src="/Textures/KawKaw/kaw_idle.gif" alt="Kaw" style="display:block;width:120px;height:auto;pointer-events:none;" />
    <audio id="kawCornerAudio" src="/Textures/KawKaw/kaw.mp3"></audio>
  </div>
  <script>
    (function() {
      const idleSrc = '/Textures/KawKaw/kaw_idle.gif';
      const lickSrc = '/Textures/KawKaw/kaw_lick.gif';
      const img = document.getElementById('kawCornerImg');
      const audio = document.getElementById('kawCornerAudio');
      const wrapper = document.getElementById('kawCorner');
      let timer = null;

      if (!img || !audio || !wrapper) return;

      wrapper.addEventListener('click', () => {
        img.src = lickSrc;
        audio.currentTime = 0;
        audio.play().catch(() => {});
        if (timer) clearTimeout(timer);
        timer = setTimeout(() => {
          img.src = idleSrc;
        }, 1000);
      });
    })();
  </script>
  </body>
</html>
